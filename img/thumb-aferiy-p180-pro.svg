<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AFERIY P180 PRO Powerstation Vorschaubild</title>
<desc>Typografisches Vorschaubild zum Magazin-Artikel ueber die AFERIY P180 PRO Powerstation im Ford Nugget</desc>

<rect width="680" height="400" rx="14" fill="#0f3d3e"/>

<rect x="30" y="30" width="620" height="340" rx="10" fill="none" stroke="#1a5c5d" stroke-width="0.5" stroke-dasharray="4 4"/>

<text x="340" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" letter-spacing="3" fill="#e08a2b">VANKOMPASS MAGAZIN</text>

<rect x="140" y="95" width="400" height="2" rx="1" fill="#e08a2b" opacity="0.6"/>

<text x="340" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">AFERIY P180 PRO</text>

<text x="340" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="400" fill="#cfe3df">1024 Wh Powerstation im Praxistest</text>

<g transform="translate(155, 230)">
  <rect width="110" height="56" rx="8" fill="#1a5c5d"/>
  <text x="55" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#e08a2b">1 kWh</text>
  <text x="55" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#8aaba6">LiFePO4</text>
</g>
<g transform="translate(285, 230)">
  <rect width="110" height="56" rx="8" fill="#1a5c5d"/>
  <text x="55" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#e08a2b">1800 W</text>
  <text x="55" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#8aaba6">Sinus</text>
</g>
<g transform="translate(415, 230)">
  <rect width="110" height="56" rx="8" fill="#1a5c5d"/>
  <text x="55" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#e08a2b">11,6 kg</text>
  <text x="55" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#8aaba6">Gewicht</text>
</g>

<rect x="190" y="310" width="300" height="36" rx="18" fill="#e08a2b"/>
<text x="340" y="334" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#0f3d3e" letter-spacing="0.5">Ford Nugget  ·  Video von Die2Mays</text>

<text x="340" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#5d7b76">vankompass.de</text>

